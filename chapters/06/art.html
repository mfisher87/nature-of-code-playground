<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <title>Chapter 6 - Physics libraries - Art</title>
  </head>
  <body>
    <main></main>

    <script>
      class Attractor {
        constructor(x, y) {
          this.radius = 32;
          this.body = Matter.Bodies.circle(x, y, this.radius, { isStatic: true });
          this.pushMagnitude = -0.4;
          this.pullMagnitude = 0.1;
          this.pushDurationFrames = 20;
          this.pushFrequencyFrames = 200;

          Matter.Composite.add(engine.world, this.body);
        }

        attract(mover) {
          let force = Matter.Vector.sub(this.body.position, mover.body.position);
          let distance = Matter.Vector.magnitude(force);
          distance = constrain(distance, 5, 25);

          let G = this.isPushing() ? this.pushMagnitude : this.pullMagnitude;
          let strength = (G * 1 * mover.body.mass) / (distance * distance);

          force = Matter.Vector.normalise(force);
          return Matter.Vector.mult(force, strength);
        }

        isPushing() {
          const validRemainders = Array.from({ length: this.pushDurationFrames }, (_, i) => i);
          return validRemainders.includes(frameCount % this.pushFrequencyFrames)
        }

        show() {
          fill(...this.isPushing() ? [255, 0, 0] : [255, 255, 255]);
          stroke(0);
          strokeWeight(2);
          push();
          translate(this.body.position.x, this.body.position.y);
          rotate(this.body.angle);
          circle(0, 0, this.radius * 2);
          pop();
        }
      }

      class Mover {
        constructor(x, y, radius) {
          this.radius = radius;
          let options = { restitution: 1, frictionAir: 0 };
          this.body = Matter.Bodies.circle(x, y, this.radius, options);
          let angle = random(TWO_PI);
          let vel = Matter.Vector.create(2 * cos(angle), 2 * sin(angle));
          let force = null;
          Matter.Body.setVelocity(this.body, vel);
          Matter.Composite.add(engine.world, this.body);
        }

        applyForce(force) {
          Matter.Body.applyForce(this.body, this.body.position, force);
          this.force = force;
        }

        show() {
          rectMode(CENTER);
          fill(200);
          stroke(0);
          strokeWeight(2);
          push();
          translate(this.body.position.x, this.body.position.y);
          rotate(this.body.angle);
          circle(0, 0, this.radius * 2);
          line(0, 0, this.radius, 0);
          pop();
        }
      }

      let movers = [];
      let attractor;

      let engine = Matter.Engine.create({
        gravity: {x: 0, y: 0},  // Turn off canvas gravity reference frame
      });

      function setup() {
        createCanvas(1280, 640);

        for (let i = 0; i < 100; i++) {
          movers[i] = new Mover(random(width), random(height), random(4, 8));
        }
        attractor = new Attractor(width / 2, height / 2);
      }

      function draw() {
        background(0);
        Matter.Engine.update(engine);

        for (let mover of movers) {
          let force = attractor.attract(mover);
          mover.applyForce(force);
          mover.show();
        }

        attractor.show();
      }
    </script>

  </body>
</html>
