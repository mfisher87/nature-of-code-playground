<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" type="text/css" href="style.css">
    <meta charset="utf-8" />
    <title>Chapter 6 - Physics libraries - Example 1</title>
  </head>
  <body>
    <main></main>

    <script>
      class Box {
        constructor(x, y) {
          this.size = 16;
          this.body = Matter.Bodies.rectangle(x, y, this.size, this.size);
          Matter.Composite.add(engine.world, this.body);
        }

        show() {
          rectMode(CENTER);
          fill(127);
          stroke(0);
          strokeWeight(2);
          push();
          translate(this.body.position.x, this.body.position.y);
          rotate(this.body.angle);
          square(0, 0, this.size);
          pop();
        }

        isBelowCanvas() {
          return this.body.position.y > height + this.size;
        }

        removeBody() {
          Matter.Composite.remove(engine.world, this.body);
        }
      }

      let engine = Matter.Engine.create({gravity: {x: 0, y: 1}});
      let boxes = [];

      function setup() {
        let canvas = createCanvas(1280, 480);
      }

      function draw() {
        background(255);

        Matter.Engine.update(engine);

        if (mouseIsPressed) {
          let b = new Box(mouseX, mouseY);
          boxes.push(b);
        }

        // Iterate backwards because ... I forget.
        // I had a different preference when I first did this
        for (let i = boxes.length - 1; i >= 0; i--) {
          boxes[i].show();

          if (boxes[i].isBelowCanvas()) {
            boxes[i].removeBody();
            boxes.splice(i, 1);
          }
        }
      }
    </script>

  </body>
</html>
